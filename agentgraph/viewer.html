<!doctype html>
<html lang="en">
<head>

<style>
/* Visual language: hollow nodes on a thin track, mono micro-labels, one green accent, white cards on a pale grid (flow);
   agent at the centre with its tools around it on a green ground (hub). Fonts use IBM Plex when installed, else system fonts. */
:root {
  --bg: #f4f5f7; --card: #ffffff; --line: #e2e3e7; --track: #cdd0d6; --fg: #23282d; --muted: #5c6168; --grid: rgba(35,40,45,.045);
  --green: #009367; --green-d: #00553c; --blue: #2c527f; --red: #b3342b; --red-soft: #fbe9e7; --amber: #a86a00;
  --hub: #dbefe1; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --sans: "IBM Plex Sans", ui-sans-serif, "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1417; --card: #171e22; --line: #2a3338; --track: #3a454b; --fg: #e3e8ec; --muted: #8f9aa3; --grid: rgba(227,232,236,.045);
    --green: #3fcf9f; --green-d: #8fe3c4; --blue: #86adda; --red: #f08a82; --red-soft: #3a1f1d; --amber: #e0a050; --hub: #14261d;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1417; --card: #171e22; --line: #2a3338; --track: #3a454b; --fg: #e3e8ec; --muted: #8f9aa3; --grid: rgba(227,232,236,.045);
  --green: #3fcf9f; --green-d: #8fe3c4; --blue: #86adda; --red: #f08a82; --red-soft: #3a1f1d; --amber: #e0a050; --hub: #14261d;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); display: flex; flex-direction: column; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--track); }
button[aria-pressed="true"] { background: var(--green-d); border-color: var(--green-d); color: var(--card); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.micro { font: 500 10.5px/1.2 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.status { font: 500 10.5px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.status.success, .status.ok, .status.verified { color: var(--green); } .status.success::before, .status.ok::before, .status.verified::before { background: var(--green); }
.status.failure, .status.error, .status.bad { color: var(--red); } .status.failure::before, .status.error::before, .status.bad::before { background: var(--red); }
.status.partial, .status.running, .status.warn { color: var(--amber); } .status.partial::before, .status.running::before, .status.warn::before { background: var(--amber); }
header.top { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
header.top .brand { display: flex; align-items: baseline; gap: 8px; }
header.top .brand b { color: var(--green); font-family: var(--mono); }
header.top h1 { font-size: 1rem; font-weight: 600; margin: 0; }
header.top .sub { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; margin-left: auto; font-size: .78rem; color: var(--muted); }
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr) 340px; }
aside#runs { border-right: 1px solid var(--line); overflow: auto; background: var(--card); padding: 8px 0; }
.run-card { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; width: 100%; text-align: left; border: 0; border-left: 2px solid transparent; border-radius: 0; padding: 10px 16px; background: none; }
.run-card:hover { background: var(--bg); }
.run-card.sel { background: var(--bg); border-left-color: var(--green); }
.run-card b { font-weight: 600; font-size: .88rem; }
.run-card .t { grid-column: 1 / -1; font-size: .78rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.run-card .meta { grid-column: 1 / -1; display: flex; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
main { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; border-left: 1px solid var(--line); background: none; } .seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--green-d); color: var(--card); }
.ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; flex: 1 1 520px; min-width: 0; }
.ctl button { flex: none; padding: 5px 9px; }
.ctl input[type=range] { flex: 1 1 120px; min-width: 80px; accent-color: var(--green); }
.ctl .pos { font: 11px var(--mono); color: var(--muted); white-space: nowrap; flex: none; }
.opt { font-size: .78rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.opt input { accent-color: var(--green); }
.stage { flex: 1; min-height: 0; overflow: auto; padding: 20px; background-color: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 40px 40px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.sel { border-color: var(--track); }
.card .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
.card .task { font-size: .88rem; color: var(--fg); margin-top: -4px; }
.card .foot { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
.card .prog { height: 2px; background: var(--line); border-radius: 1px; overflow: hidden; } .card .prog i { display: block; height: 100%; background: var(--green); }
.card.hub svg.mini { background: var(--hub); border-radius: 10px; }
.card.hub { border-color: transparent; }
svg.mini { width: 100%; height: auto; max-height: 300px; display: block; }
.key { display: inline-flex; align-items: center; gap: 7px; font-size: .78rem; color: var(--muted); }
.key svg { flex: none; }
svg.graph text { font-family: var(--mono); fill: var(--fg); }
svg.graph .track { fill: none; stroke: var(--track); stroke-width: 1.6; }
svg.graph .live { fill: none; stroke: var(--green); stroke-width: 1.8; stroke-dasharray: 6 5; }
svg.graph .loop { fill: none; stroke: var(--blue); stroke-width: 1.3; stroke-dasharray: 1.5 4; stroke-linecap: round; }
svg.graph .track.dim, svg.graph .live.dim, svg.graph .loop.dim { opacity: .14; }
svg.graph .live.path { stroke: var(--green-d); stroke-width: 2.6; stroke-dasharray: none; }
svg.graph .node { cursor: pointer; }
svg.graph .node circle.c { fill: var(--card); stroke: var(--blue); stroke-width: 1.6; }
svg.graph .node.k-tool circle.c, svg.graph .node.k-query circle.c { stroke: var(--green); }
svg.graph .node.k-evidence circle.c { fill: var(--green); stroke: var(--green); }
svg.graph .node.k-answer circle.c { fill: var(--green-d); stroke: var(--green-d); }
svg.graph .node.k-answer circle.ring { fill: none; stroke: var(--green-d); stroke-width: 1.4; }
svg.graph .node.k-agent circle.ring { fill: none; stroke: var(--blue); stroke-width: 1.6; }
svg.graph .node.k-agent circle.c { stroke: none; fill: var(--blue); }
svg.graph .node.k-think circle.c, svg.graph .node.k-plan circle.c { stroke: var(--muted); }
svg.graph .node.err circle.c { stroke: var(--red); fill: var(--red-soft); stroke-width: 2; }
svg.graph .node.run circle.c { stroke: var(--amber); stroke-dasharray: 3 2.5; stroke-width: 2; }
svg.graph .node:hover circle.c { stroke-width: 2.6; }
svg.graph .node.sel .halo { stroke: var(--green); }
svg.graph .halo { fill: none; stroke: transparent; stroke-width: 1.6; }
svg.graph .node.dim { opacity: .3; }
svg.graph .node.path circle.c { stroke-width: 2.4; }
svg.graph .ghost { fill: none; stroke: var(--track); stroke-dasharray: 1.5 3; opacity: .8; }
svg.graph .lbl-k { font-size: 9px; letter-spacing: .09em; fill: var(--muted); text-transform: uppercase; }
svg.graph .lbl-t { font-size: 11.5px; }
svg.graph .lbl-s { font-size: 9.5px; fill: var(--muted); }
svg.graph .pulse { fill: var(--green); offset-rotate: 0deg; animation: travel .9s ease-out 1 both; }
@keyframes travel { from { offset-distance: 0%; opacity: 1; } to { offset-distance: 100%; opacity: 0; } }
@media (prefers-reduced-motion: reduce) { svg.graph .pulse { display: none; } }
svg.hubsvg .spoke { fill: none; stroke: var(--fg); stroke-opacity: .55; stroke-linecap: round; }
svg.hubsvg .spoke.err { stroke: var(--red); stroke-opacity: 1; stroke-dasharray: 5 4; }
svg.hubsvg .spoke.live { stroke: var(--green-d); stroke-opacity: 1; }
svg.hubsvg .end { fill: var(--card); stroke: var(--fg); stroke-width: 1.6; }
svg.hubsvg .end.err { stroke: var(--red); }
svg.hubsvg .core { fill: var(--card); stroke: var(--fg); stroke-width: 2.4; }
svg.hubsvg text { font-family: var(--mono); fill: var(--fg); }
svg.hubsvg .hn { font-size: 11px; font-weight: 600; } svg.hubsvg .hm { font-size: 9.5px; fill: var(--muted); }
section#inspector { border-left: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-radius: 0; background: none; padding: 11px 16px; border-bottom: 2px solid transparent; font: 500 10.5px var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.tabs button.on { color: var(--fg); border-bottom-color: var(--green); }
.pane { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.pane h3 { margin: 0; font-size: 1rem; font-weight: 600; overflow-wrap: anywhere; }
.pane h5 { margin: 8px 0 3px; font: 500 10px var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.pane pre { margin: 0; padding: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; font: 11.5px/1.5 var(--mono); max-height: 240px; overflow: auto; }
.kv { display: grid; grid-template-columns: 78px 1fr; gap: 4px 10px; font-size: .82rem; margin: 0; }
.kv dt { color: var(--muted); font: 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding-top: 2px; } .kv dd { margin: 0; overflow-wrap: anywhere; }
button.lnk { color: var(--blue); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; font: 12px var(--mono); }
table { border-collapse: collapse; width: 100%; font-size: .8rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 10px var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); position: sticky; top: 0; background: var(--card); }
tr.future td { opacity: .35; } tr.curr td { background: var(--hub); } tr.log { cursor: pointer; }
.tablewrap { overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.empty { color: var(--muted); padding: 24px 8px; text-align: center; font-size: .88rem; }
.digest { word-break: break-all; font: 11px var(--mono); }
@media (max-width: 1100px) { .app { grid-template-columns: 210px minmax(0, 1fr); } section#inspector { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; } }
@media (max-width: 720px) { .app { grid-template-columns: 1fr; } aside#runs { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); } .run-card { min-width: 210px; } header.top .sub { margin-left: 0; } }
</style>

<body>
<header class="top">
  <div class="brand"><b>&gt;_</b><h1 id="title"></h1></div>
  <div class="sub" id="topmeta"></div>
</header>
<div class="app">
  <aside id="runs" aria-label="Runs"></aside>
  <main>
    <div class="bar">
      <div class="seg" id="viewSeg" role="group" aria-label="View">
        <button data-v="compare">Compare</button><button data-v="hub">Hub</button><button data-v="run">Run</button><button data-v="summary">Summary</button>
      </div>
      <div class="ctl" id="ctl">
        <button id="bFirst" title="Start (Home)" aria-label="Go to start">&#9198;</button>
        <button id="bPrev" title="Back one event (Left)" aria-label="Back one event">&#9664;</button>
        <button id="bPlay" title="Play / pause (Space)" aria-label="Play">&#9654; Play</button>
        <button id="bNext" title="Forward one event (Right)" aria-label="Forward one event">&#9654;&#9654;</button>
        <button id="bLast" title="End (End)" aria-label="Go to end">&#9197;</button>
        <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Replay position">
        <select id="speed" aria-label="Speed"><option value="1400">0.5x</option><option value="700" selected>1x</option><option value="350">2x</option><option value="150">5x</option></select>
        <span class="pos" id="posLabel"></span>
      </div>
      <label class="opt"><input type="checkbox" id="pathOn" checked> highlight path to selection</label>
    </div>
    <div class="stage" id="stage" tabindex="0"></div>
  </main>
  <section id="inspector" aria-label="Inspector">
    <div class="tabs" id="tabs"><button data-t="node">Node</button><button data-t="log">Event log</button><button data-t="audit">Audit</button></div>
    <div class="pane" id="pane"></div>
  </section>
</div>

    pane.innerHTML = '<table><thead><tr><th>#</th><th>Time</th><th>Event</th></tr></thead><tbody>' + r.events.map(function (e, i) {
      var what = e.type === 'node' ? e.kind + ': ' + e.label : e.type === 'update' ? 'update ' + e.id + (e.status ? ' → ' + e.status : '') : e.type === 'end' ? 'end: ' + e.outcome : 'run started';
      return '<tr class="log' + (i >= p ? ' future' : '') + (i === p - 1 ? ' curr' : '') + '" data-goto="' + (i + 1) + '"' + (e.id ? ' data-sel="' + esc(e.id) + '"' : '') + '><td class="mono">' + i + '</td><td class="mono">' + rel(r, e.ts) + '</td><td>' + esc(what) + '</td></tr>';
    }).join('') + '</tbody></table>';
    var cur = pane.querySelector('tr.curr'); if (cur) cur.scrollIntoView({ block: 'nearest' });
  } else {
    pane.innerHTML = RUNS.map(function (x) {
      var v = x.verify;
      return '<div class="card" style="box-shadow:none;border-radius:12px;padding:14px"><div class="head" style="cursor:default"><b>' + esc(x.agent) + '</b><span class="status ' + (v.done ? (v.ok ? 'verified' : 'bad') : '') + '">' + (v.done ? (v.ok ? 'chain intact' : 'tampered') : 'checking') + '</span></div>' +
        '<dl class="kv"><dt>File</dt><dd class="mono">' + esc(x.file) + '</dd><dt>Events</dt><dd class="mono">' + x.events.length + '</dd><dt>Head</dt><dd class="digest">' + esc(v.head || x.head || '') + '</dd></dl>' +
        (v.done && !v.ok ? '<pre>' + esc(v.errors.map(function (e) { return 'line ' + (e[0] + 1) + ': ' + e[1]; }).join('\n')) + '</pre>' : '') +
        '<div><button data-export="' + esc(x.id) + '">Export trace (.jsonl)</button></div></div>';
    }).join('') + '<div class="card" style="box-shadow:none;border-radius:12px;padding:14px"><span class="micro">Report digest</span><div class="digest">' + esc(DATA.digest) + '</div><div class="muted" style="font-size:.78rem">Save this value when the report is created. Each run\'s head hash is recomputed here from the raw lines. A match with a digest you saved earlier shows nothing was removed from the end of a trace.</div></div>';
  }
}
function renderControls() {
  var scrub = $('#scrub'), r = run(), isC = isMulti(), max = isC ? maxN() : r.events.length, val = isC ? S.tick : posOf(r);
  $('#ctl').style.display = S.view === 'summary' ? 'none' : 'flex';
  scrub.max = max; scrub.value = val;
  $('#posLabel').textContent = isC ? 'tick ' + val + ' / ' + max + ' · all runs' : 'event ' + val + ' / ' + max + (val > 0 ? ' · ' + rel(r, r.events[val - 1].ts) : '');
  var bp = $('#bPlay'); bp.innerHTML = S.playing ? '&#10074;&#10074; Pause' : '&#9654; Play'; bp.setAttribute('aria-label', S.playing ? 'Pause' : 'Play');
  document.querySelectorAll('#viewSeg button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === S.view); });
  $('#pathOn').checked = S.pathOn;
}
function renderAll() { renderTop(); renderRuns(); renderControls(); renderStage(); renderPane(); syncHash(); }
function renderLight() { renderControls(); renderStage(); renderPane(); syncHash(); }

/* ---------- interaction ---------- */
function setPos(v) {
  if (isMulti()) S.tick = Math.max(0, Math.min(maxN(), v));
  else { var r = run(); S.pos[r.id] = Math.max(0, Math.min(r.events.length, v)); }
  renderLight();
}
function curPos() { return isMulti() ? S.tick : posOf(run()); }
function limit() { return isMulti() ? maxN() : run().events.length; }
function stop() { S.playing = false; clearInterval(S.timer); }
function play() {
  if (S.playing) { stop(); renderControls(); return; }
  if (curPos() >= limit()) setPos(0);
  S.playing = true;
  S.timer = setInterval(function () { if (curPos() >= limit()) { stop(); renderControls(); return; } setPos(curPos() + 1); }, +$('#speed').value);
  renderControls();
}
function select(runId, id) { S.selRun = runId; S.sel = id; S.runId = runId; S.reveal = false; if (S.tab !== 'log') S.tab = 'node'; renderAll(); }
function openRun(id) { S.runId = id; S.view = 'run'; S.sel = null; stop(); renderAll(); }
function syncHash() {
  try { history.replaceState(null, '', '#v=' + S.view + '&r=' + encodeURIComponent(S.runId) + '&p=' + curPos() + (S.sel ? '&n=' + S.sel : '')); } catch (e) { }
}
function readHash() {
  var h = {}; location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) h[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
  if (['run', 'compare', 'hub', 'summary'].indexOf(h.v) >= 0) S.view = h.v;
  if (h.r && RUNS.some(function (r) { return r.id === h.r; })) S.runId = h.r;
  if (h.p != null && !isNaN(+h.p)) { if (isMulti()) S.tick = +h.p; else S.pos[S.runId] = +h.p; }
  if (h.n) { S.sel = h.n; S.selRun = S.runId; S.reveal = true; }
}
function exportRun(id) {
  var r = RUNS.filter(function (x) { return x.id === id; })[0];
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([r.lines.join('\n') + '\n'], { type: 'application/x-ndjson' })); a.download = r.file; a.click();
}
function bind() {
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-run],[data-sel],[data-goto],[data-open],[data-export],[data-v],[data-t],[data-zoom],.node'); if (!t) return;
    if (t.dataset.zoom) { var cur = $('#stage button[data-zoom]').getAttribute('aria-pressed') === 'true'; S.fit = !cur; return renderStage(); }
    if (t.dataset.export) return exportRun(t.dataset.export);
    if (t.dataset.v) { S.view = t.dataset.v; stop(); if (isMulti() && S.tick === 0) S.tick = maxN(); renderAll(); return; }
    if (t.dataset.t) { S.tab = t.dataset.t; renderPane(); return; }
    if (t.dataset.goto) { stop(); setPos(+t.dataset.goto); if (t.dataset.sel) { S.sel = t.dataset.sel; S.selRun = S.runId; renderLight(); } return; }
    if (t.dataset.open) return openRun(t.dataset.open);
    if (t.classList.contains('node')) { var svg = t.closest('svg'); return select(svg.dataset.run, t.dataset.id); }
    if (t.dataset.sel) { S.sel = t.dataset.sel; renderAll(); return; }
    if (t.dataset.run && t.closest('#runs')) { S.runId = t.dataset.run; S.selRun = null; S.sel = null; if (S.view === 'summary') S.view = 'run'; renderAll(); }
  });
  $('#scrub').addEventListener('input', function (e) { stop(); setPos(+e.target.value); });
  $('#bFirst').onclick = function () { stop(); setPos(0); };
  $('#bLast').onclick = function () { stop(); setPos(limit()); };
  $('#bPrev').onclick = function () { stop(); setPos(curPos() - 1); };
  $('#bNext').onclick = function () { stop(); setPos(curPos() + 1); };
  $('#bPlay').onclick = play;
  $('#speed').onchange = function () { if (S.playing) { stop(); play(); } };
  $('#pathOn').onchange = function (e) { S.pathOn = e.target.checked; renderLight(); };
  document.addEventListener('keydown', function (e) {
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.target.type !== 'range') return;
    if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); play(); }
    else if (e.key === 'ArrowRight') { stop(); setPos(curPos() + 1); } else if (e.key === 'ArrowLeft') { stop(); setPos(curPos() - 1); }
    else if (e.key === 'Home') { stop(); setPos(0); } else if (e.key === 'End') { stop(); setPos(limit()); }
  });
  window.addEventListener('hashchange', function () { readHash(); renderAll(); });
}

/* ---------- boot ---------- */
function boot() {
  if (!DATA || !DATA.runs || !DATA.runs.length) { document.body.innerHTML = '<p class="empty">This report contains no runs.</p>'; return; }
  RUNS = DATA.runs.map(function (r) { var run = parseRun(r); run.head = r.head; return run; });
  S.runId = RUNS[0].id; S.tick = maxN();
  S.view = RUNS.length === 1 ? 'run' : 'compare';
  readHash(); bind(); renderAll();
  Promise.all(RUNS.map(verifyRun)).then(function () { renderTop(); renderRuns(); renderPane(); window.__agentgraphReady = true; });
}
try { boot(); } catch (err) { document.body.insertAdjacentHTML('afterbegin', '<pre style="color:#b3342b;padding:16px">AgentGraph could not read this report: ' + esc(err && err.message) + '</pre>'); }
window.__agentgraph = { sha256Js: sha256Js, state: S, runs: function () { return RUNS; } };
})();
</script>
</body>
