.run-card b { font-size: 0.9rem; }

main { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
.seg button:last-child { border-radius: 0 4px 4px 0; }
.ctl { display: flex; gap: 6px; align-items: center; flex: 1; min-width: 260px; }
.ctl input[type=range] { flex: 1; min-width: 80px; accent-color: var(--accent); }
.ctl .pos { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); min-width: 150px; text-align: right; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 12px; font-size: 0.72rem; border-bottom: 1px solid var(--line); color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -3px; margin-right: 4px; font: 700 9px/14px var(--mono); text-align: center; color: var(--bg); font-style: normal; }
.stage { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
.chip { display: inline-block; font: 600 0.68rem/1 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 6px; border-radius: 3px; background: var(--line); color: var(--fg); }
.chip.success, .chip.ok { background: var(--ok); color: var(--bg); }
.chip.failure, .chip.error, .chip.bad { background: var(--bad); color: var(--bg); }
.chip.partial, .chip.running, .chip.warn { background: var(--warn); color: var(--bg); }

.card.sel { border-color: var(--accent); }
.card header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; cursor: pointer; }
.card header b { font-size: 0.92rem; }
.card .task { font-size: 0.78rem; color: var(--muted); }
.card svg.mini { width: 100%; height: 220px; background: var(--bg); border-radius: 4px; }
.strip { display: flex; gap: 2px; flex-wrap: wrap; }

.strip i.on { background: var(--c, var(--accent)); }
.strip i.cur { outline: 2px solid var(--fg); outline-offset: 1px; }

a.lnk, button.lnk { color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; font-family: var(--mono); font-size: 0.8rem; }
table { border-collapse: collapse; width: 100%; font-size: 0.8rem; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 0.66rem var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); position: sticky; top: 0; background: var(--surface); }
tr.future td { opacity: 0.35; }
tr.curr td { background: var(--accent-soft); }
tr.log { cursor: pointer; }
.tablewrap { overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.empty { color: var(--muted); padding: 20px; text-align: center; }
.digest { word-break: break-all; font: 11px var(--mono); }
@media (max-width: 1100px) { .app { grid-template-columns: 220px minmax(0, 1fr); } section#inspector { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; } }

  <div class="sub" id="topmeta"></div>
</header>
<div class="app">
  <aside id="runs" aria-label="Runs"></aside>

      <div class="ctl" id="ctl">

        <button id="bPrev" title="Back one event (Left)" aria-label="Back one event">&#9664;</button>
        <button id="bPlay" title="Play / pause (Space)" aria-label="Play">&#9654; Play</button>
        <button id="bNext" title="Forward one event (Right)" aria-label="Forward one event">&#9654;&#9654;</button>
        <button id="bLast" title="End (End)" aria-label="Go to end">&#9197;</button>
        <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Replay position">
        <select id="speed" aria-label="Speed"><option value="1400">0.5x</option><option value="700" selected>1x</option><option value="350">2x</option><option value="150">5x</option></select>
        <span class="pos" id="posLabel"></span>
      </div>
      <label class="muted" style="font-size:0.8rem"><input type="checkbox" id="pathOn" checked> highlight path to selection</label>
    </div>
    <div class="legend" id="legend"></div>
    <div class="stage" id="stage" tabindex="0"></div>
  </main>
  <section id="inspector" aria-label="Inspector">
    <div class="tabs" id="tabs"><button data-t="node">Node</button><button data-t="log">Event log</button><button data-t="audit">Audit</button></div>
    <div class="pane" id="pane"></div>

</div>

/* ---------- graph drawing ---------- */
var NW = 164, NH = 44, CW = 184, RH = 74, PAD = 14;

    } else {
      var label = n.label.length > 24 ? n.label.slice(0, 23) + '…' : n.label;
      var sub = (n.status === 'running' ? 'running' : n.status) + (n.dur != null ? ' · ' + fmtMs(n.dur) : '');
      out.push('<g class="' + cls + '" data-id="' + esc(n.id) + '"><rect class="nbox" x="' + x + '" y="' + y + '" width="' + NW + '" height="' + NH + '" rx="5"/>' +
        '<rect x="' + (x + 6) + '" y="' + (y + 11) + '" width="22" height="22" rx="4" style="fill:' + kindColor(n.kind) + '"/><text class="nb" x="' + (x + 17) + '" y="' + (y + 26) + '" text-anchor="middle">' + esc(ki[0]) + '</text>' +
        '<text class="nl" x="' + (x + 36) + '" y="' + (y + 19) + '">' + esc(label) + '</text><text class="ns" x="' + (x + 36) + '" y="' + (y + 34) + '">' + esc(n.id + ' · ' + sub) + '</text><title>' + esc(ki[1] + ': ' + n.label) + '</title></g>');

/* ---------- app state ---------- */
var S = { view: 'compare', runId: null, pos: {}, tick: 0, sel: null, selRun: null, tab: 'node', playing: false, timer: null, pathOn: true };

function renderLegend() {

    '<span><i style="background:transparent;border:1.5px dashed var(--warn)"></i>running</span><span><i style="background:var(--bad-soft);border:1.5px solid var(--bad)"></i>error</span>';
}
function renderRuns() {

      '<span class="meta"><span class="chip ' + esc(s.outcome) + '">' + esc(s.outcome) + '</span><span>' + s.steps + ' steps</span><span>' + fmtMs(s.dur) + '</span>' +

}

    '<span class="chip ' + (allDone ? (allOk ? 'ok' : 'bad') : '') + '" id="integrity">' + (allDone ? (allOk ? 'all hash chains verified in this browser' : 'INTEGRITY FAILURE: see Audit tab') : 'verifying…') + '</span>' +

}
function renderStage() {

  if (S.view === 'run') {
    var r = run(), p = posOf(r), s = stateAt(r, p), g = drawGraph(r, s, { sel: S.selRun === r.id ? S.sel : null, pathOn: S.pathOn, pulse: true });
    var avail = Math.max(st.clientWidth - 24, 320), fit = S.fit == null ? (g.w <= avail * 2.2 && !r.folded) : S.fit;

      '</div></div><svg class="graph" data-run="' + esc(r.id) + '" ' + size + ' viewBox="0 0 ' + g.w + ' ' + g.h + '" role="img" aria-label="Workflow graph of ' + esc(r.agent) + ' at event ' + p + '">' + g.body + '</svg>';

function summaryHtml() {

    ['Steps', function (r) { return r.stats.steps; }], ['Tool/data calls', function (r) { return r.stats.tools; }], ['Errors', function (r) { return r.stats.errors; }],
    ['Sub-agents', function (r) { return r.stats.agents; }], ['Depth', function (r) { return r.stats.depth; }], ['Max fan-out', function (r) { return r.stats.fanout; }],
    ['Evidence cited', function (r) { return r.stats.cited; }], ['Duration', function (r) { return fmtMs(r.stats.dur); }],
    ['Integrity', function (r) { return r.verify.done ? '<span class="chip ' + (r.verify.ok ? 'ok' : 'bad') + '">' + (r.verify.ok ? 'verified' : 'tampered') + '</span>' : '…'; }]];

    RUNS.map(function (r) { return '<tr class="log" data-open="' + esc(r.id) + '">' + cols.map(function (c) { return '<td class="' + (typeof c[1](r) === 'number' ? 'mono' : '') + '">' + c[1](r) + '</td>'; }).join('') + '</tr>'; }).join('') +
    '</tbody></table></div><h5 class="muted" style="font:600 0.68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:16px 0 6px">Run summaries</h5><div class="tablewrap"><table><tbody>' + finals + '</tbody></table></div>';
}
function dataBlocks(d) {
  var keys = Object.keys(d || {}); if (!keys.length) return '<div class="muted">No payload recorded.</div>';
  return keys.map(function (k) { var v = d[k]; return '<h5>' + esc(k) + '</h5><pre>' + esc(typeof v === 'string' ? v : JSON.stringify(v, null, 2)) + '</pre>'; }).join('');
}
function renderPane() {
  var r = S.selRun ? RUNS.filter(function (x) { return x.id === S.selRun; })[0] : run();
  r = r || run();

    var ki = kindInfo(n.kind);
    pane.innerHTML = '<div><span class="chip" style="background:' + kindColor(n.kind) + ';color:var(--bg)">' + esc(ki[1]) + '</span> <span class="chip ' + esc(n.status) + '">' + esc(n.status) + '</span></div><h3>' + esc(n.label) + '</h3>' +
      '<dl class="kv"><dt>Run</dt><dd>' + esc(r.agent) + '</dd><dt>Node</dt><dd class="mono">' + esc(n.id) + '</dd><dt>Started</dt><dd class="mono">' + rel(r, n.ts) + '</dd><dt>Duration</dt><dd class="mono">' + fmtMs(n.dur) + '</dd>' +
      '<dt>Parent</dt><dd>' + (n.parent ? '<button class="lnk" data-sel="' + esc(n.parent) + '">' + esc(n.parent) + '</button>' : 'none (root)') + '</dd>' +
      '<dt>Cites</dt><dd>' + (n.cites.length ? n.cites.map(function (c) { return '<button class="lnk" data-sel="' + esc(c) + '">' + esc(c) + '</button>'; }).join(' ') : 'none') + '</dd>' +
      '<dt>Event</dt><dd class="mono">#' + n.created + (n.touched !== n.created ? ', last change #' + n.touched : '') + ' <button class="lnk" data-goto="' + (n.created + 1) + '">jump to creation</button></dd></dl>' + dataBlocks(n.data);

    pane.innerHTML = '<table><thead><tr><th>#</th><th>Time</th><th>Event</th></tr></thead><tbody>' + r.events.map(function (e, i) {
      var what = e.type === 'node' ? e.kind + ': ' + e.label : e.type === 'update' ? 'update ' + e.id + (e.status ? ' → ' + e.status : '') : e.type === 'end' ? 'end: ' + e.outcome : 'run started';
      return '<tr class="log' + (i >= p ? ' future' : '') + (i === p - 1 ? ' curr' : '') + '" data-goto="' + (i + 1) + '"' + (e.id ? ' data-sel="' + esc(e.id) + '"' : '') + '><td class="mono">' + i + '</td><td class="mono">' + rel(r, e.ts) + '</td><td>' + esc(what) + '</td></tr>';

        '<dl class="kv"><dt>File</dt><dd class="mono">' + esc(x.file) + '</dd><dt>Events</dt><dd class="mono">' + x.events.length + '</dd><dt>Head hash</dt><dd class="digest">' + esc(v.head || x.head || '') + '</dd></dl>' +
        (v.done && !v.ok ? '<pre>' + esc(v.errors.map(function (e) { return 'line ' + (e[0] + 1) + ': ' + e[1]; }).join('\n')) + '</pre>' : '') +
        '<button data-export="' + esc(x.id) + '">Export trace (.jsonl)</button></div>';
    }).join('') + '<div class="card"><b>Report digest</b><div class="digest">' + esc(DATA.digest) + '</div><div class="muted" style="font-size:0.78rem">Record this value when the report is created. Each run\'s head hash is recomputed here from the raw lines. A match with a digest you saved earlier shows nothing was removed from the end of a trace.</div></div>';
  }
}
function renderControls() {
  var scrub = $('#scrub'), r = run(), isC = S.view === 'compare', max = isC ? maxN() : r.events.length, val = isC ? S.tick : posOf(r);
  $('#ctl').style.display = S.view === 'summary' ? 'none' : 'flex';
  scrub.max = max; scrub.value = val;
  $('#posLabel').textContent = isC ? 'tick ' + val + ' / ' + max + ' (all runs)' : 'event ' + val + ' / ' + max + (val > 0 ? ' · ' + rel(r, r.events[val - 1].ts) : '');
  var bp = $('#bPlay'); bp.innerHTML = S.playing ? '&#10074;&#10074; Pause' : '&#9654; Play'; bp.setAttribute('aria-label', S.playing ? 'Pause' : 'Play');

function renderAll() { renderTop(); renderRuns(); renderLegend(); renderControls(); renderStage(); renderPane(); syncHash(); }
function renderLight() { renderControls(); renderStage(); renderPane(); syncHash(); }

/* ---------- interaction ---------- */
function setPos(v) {

  else { var r = run(); S.pos[r.id] = Math.max(0, Math.min(r.events.length, v)); }
  renderLight();
}
function curPos() { return S.view === 'compare' ? S.tick : posOf(run()); }
function limit() { return S.view === 'compare' ? maxN() : run().events.length; }
function stop() { S.playing = false; clearInterval(S.timer); }
function play() {

  renderControls();
}
function select(runId, id) { S.selRun = runId; S.sel = id; S.runId = runId; S.reveal = false; if (S.tab !== 'log') S.tab = 'node'; renderAll(); }
function openRun(id) { S.runId = id; S.view = 'run'; S.sel = null; stop(); renderAll(); }
function syncHash() {
  try { history.replaceState(null, '', '#v=' + S.view + '&r=' + encodeURIComponent(S.runId) + '&p=' + curPos() + (S.sel ? '&n=' + S.sel : '')); } catch (e) { }
}
function readHash() {
  var h = {}; location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) h[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
  if (h.v === 'run' || h.v === 'compare' || h.v === 'summary') S.view = h.v;
  if (h.r && RUNS.some(function (r) { return r.id === h.r; })) S.runId = h.r;
  if (h.p != null && !isNaN(+h.p)) { if (S.view === 'compare') S.tick = +h.p; else S.pos[S.runId] = +h.p; }

function exportRun(id) {
  var r = RUNS.filter(function (x) { return x.id === id; })[0];
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([r.lines.join('\n') + '\n'], { type: 'application/x-ndjson' })); a.download = r.file; a.click();
}
function bind() {
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-run],[data-sel],[data-goto],[data-open],[data-export],[data-v],[data-t],[data-zoom],.node'); if (!t) return;

    if (t.dataset.t) { S.tab = t.dataset.t; renderPane(); return; }

    if (t.dataset.open) { if (t.closest('.card') && !e.target.closest('header')) return; return openRun(t.dataset.open); }
    if (t.classList.contains('node')) { var svg = t.closest('svg'); return select(svg.dataset.run, t.dataset.id); }
    if (t.dataset.sel) { S.sel = t.dataset.sel; renderAll(); return; }
    if (t.dataset.run && t.closest('#runs')) { S.runId = t.dataset.run; S.selRun = null; S.sel = null; if (S.view === 'summary') S.view = 'run'; renderAll(); }
  });

  $('#bFirst').onclick = function () { stop(); setPos(0); };
  $('#bLast').onclick = function () { stop(); setPos(limit()); };
  $('#bPrev').onclick = function () { stop(); setPos(curPos() - 1); };
  $('#bNext').onclick = function () { stop(); setPos(curPos() + 1); };
  $('#bPlay').onclick = play;
  $('#speed').onchange = function () { if (S.playing) { stop(); play(); } };

/* ---------- boot ---------- */
function boot() {
  if (!DATA || !DATA.runs || !DATA.runs.length) { document.body.innerHTML = '<p class="empty">This report contains no runs.</p>'; return; }
  RUNS = DATA.runs.map(function (r) { var run = parseRun(r); run.head = r.head; return run; });
  S.runId = RUNS[0].id; S.tick = maxN();
  S.view = RUNS.length === 1 ? 'run' : 'compare';

try { boot(); } catch (err) { document.body.insertAdjacentHTML('afterbegin', '<pre style="color:#a3322a;padding:16px">AgentGraph could not read this report: ' + esc(err && err.message) + '</pre>'); }

})();
